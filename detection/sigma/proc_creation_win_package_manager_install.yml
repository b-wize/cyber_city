title: Software Package Manager Installation Activity
id: 7c4b4dbd-a4f8-4c51-a9ec-deca1701f2b5
status: experimental
description: |
    Detects software package installations via common package managers including
    pip (Python), npm (Node.js), Chocolatey, Winget, and PowerShell's Install-Module cmdlet. May indicate
    unauthorized software installation, dependency confusion attacks, or staging of
    malicious tooling on an endpoint.
references:
    - https://attack.mitre.org/techniques/T1195/001/
    - https://medium.com/@alex.birsan/dependency-confusion-4a5d60fec610
author: Anthony Riojas
date: 2026/07/07
tags:
    - attack.execution
    - attack.initial-access
    - attack.t1195.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_pip:
        Image|endswith:
            - '\pip.exe'
            - '\pip3.exe'
        CommandLine|contains: ' install'
    selection_python_pip:
        Image|endswith: 
            - '\python.exe'
            - '\python3.exe'
        CommandLine|contains|all:
            - '-m'
            - 'pip'
            - ' install'
    selection_npm:
        Image|endswith:
            - '\npm.cmd'
            - '\npm.exe'
        CommandLine|contains: ' install'
    selection_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains: 'Install-Module'
    selection_chocolatey:
        Image|endswith:
            - '\choco.exe'
        CommandLine|contains: ' install'
    selection_winget:
        Image|endswith:
            - '\winget.exe'
        CommandLine|contains: ' install'

    condition: 1 of selection_*
falsepositives:
    - Legitimate software development activity
    - System administrators installing required packages or modules
    - Automated CI/CD pipeline activity
level: low

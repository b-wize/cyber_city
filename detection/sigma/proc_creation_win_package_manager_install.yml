title: Software Package Manager Installation Activity
id: 3b4c5d6e-7f8a-4b9c-ad1e-2f3a4b5c6d7e
status: experimental
description: |
    Detects software package installations via common package managers including
    pip (Python), npm (Node.js), Chocolatey, Winget, and PowerShell's Install-Module cmdlet. May indicate
    unauthorized software installation, dependency confusion attacks, or staging of
    malicious tooling on an endpoint.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1059/003/
    - https://owasp.org/www-project-top-ten/
author: Anthony Riojas
date: 2026/07/07
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_pip:
        Image|endswith:
            - '\pip.exe'
            - '\pip3.exe'
        CommandLine|contains: ' install'
    selection_python_pip:
        Image|endswith: '\python.exe'
        CommandLine|contains|all:
            - '-m'
            - 'pip'
            - ' install'
    selection_npm:
        Image|endswith:
            - '\npm.cmd'
            - '\npm.exe'
        CommandLine|contains: ' install'
    selection_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains: 'Install-Module'
    selection_chocolatey:
        Image|endswith:
            - '\choco.exe'
        CommandLine|contains: ' install'
    selection_winget:
        Image|endswith:
            - '\winget.exe'
        CommandLine|contains: ' install'

    condition: 1 of selection_*
falsepositives:
    - Legitimate software development activity
    - System administrators installing required packages or modules
    - Automated CI/CD pipeline activity
level: low
